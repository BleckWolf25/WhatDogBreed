<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1511" />
    <title>Offline - What Dog Breed?</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #0d1511;
        color: #f1f7f1;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 0.75rem;
      }
      p {
        color: #a2b1a6;
        line-height: 1.6;
        font-size: 0.92rem;
      }
      nav {
        display: grid;
        gap: 0.55rem;
        margin-top: 1.25rem;
      }
      a {
        display: block;
        padding: 0.7rem 1rem;
        border: 1px solid #79c98a;
        border-radius: 10px;
        color: #a5efb2;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Breed scans need an internet connection, but cached breed profiles may still be available if
        you visited them before.
      </p>
      <nav>
        <a href="/encyclopedia">Browse breed catalog</a>
        <a href="/scanner">Back to scanner</a>
      </nav>
    </main>
  </body>
</html>
